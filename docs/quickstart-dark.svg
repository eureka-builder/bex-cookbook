<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b0"/></marker></defs>
<rect x="20.0" y="30" width="212.0" height="222" rx="10" fill="#161b22" stroke="#f0894b" stroke-width="1.5"/>
<circle cx="44.0" cy="56" r="12" fill="#f0894b"/>
<text x="44.0" y="60.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">1</text>
<text x="64.0" y="61" font-size="15" font-weight="600" fill="#e6edf3">Get admitted</text>
<text x="36.0" y="88" font-size="11" fill="#f0894b">once, in Telegram</text>
<text x="36.0" y="112" fill="#e6edf3">send the builder your signer</text>
<text x="36.0" y="128" fill="#e6edf3">address, new or existing</text>
<rect x="32.0" y="160" width="188.0" height="26" rx="5" fill="#21282f"/>
<text x="40.0" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">t.me/EurekaBuilder</text>
<line x1="36.0" y1="226" x2="216.0" y2="226" stroke="#30393f"/>
<text x="36.0" y="243" font-size="11.5" fill="#9aa7b0">you get <tspan font-weight="600" fill="#f0894b">access</tspan></text>
<line x1="235.0" y1="141.0" x2="253.0" y2="141.0" stroke="#9aa7b0" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="256.0" y="30" width="212.0" height="222" rx="10" fill="#161b22" stroke="#30393f" stroke-width="1"/>
<circle cx="280.0" cy="56" r="12" fill="#e6edf3"/>
<text x="280.0" y="60.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">2</text>
<text x="300.0" y="61" font-size="15" font-weight="600" fill="#e6edf3">Build and simulate</text>
<text x="272.0" y="88" font-size="11" fill="#9aa7b0">once, a few minutes</text>
<text x="272.0" y="112" fill="#e6edf3">build your requests, then</text>
<text x="272.0" y="128" fill="#e6edf3">dry-run them on the builder</text>
<rect x="268.0" y="160" width="188.0" height="26" rx="5" fill="#21282f"/>
<text x="276.0" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">bex_simulate</text>
<line x1="272.0" y1="226" x2="452.0" y2="226" stroke="#30393f"/>
<text x="272.0" y="243" font-size="11.5" fill="#9aa7b0">you see <tspan font-weight="600" fill="#e6edf3">a result per request</tspan></text>
<line x1="471.0" y1="141.0" x2="489.0" y2="141.0" stroke="#9aa7b0" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="492.0" y="30" width="212.0" height="222" rx="10" fill="#161b22" stroke="#30393f" stroke-width="1"/>
<circle cx="516.0" cy="56" r="12" fill="#e6edf3"/>
<text x="516.0" y="60.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">3</text>
<text x="536.0" y="61" font-size="15" font-weight="600" fill="#e6edf3">Run</text>
<text x="508.0" y="88" font-size="11" fill="#9aa7b0">every block</text>
<text x="508.0" y="112" fill="#e6edf3">send each request for</text>
<text x="508.0" y="128" fill="#e6edf3">the next block</text>
<rect x="504.0" y="160" width="188.0" height="26" rx="5" fill="#21282f"/>
<text x="512.0" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">bex_sendBundle</text>
<line x1="508.0" y1="226" x2="688.0" y2="226" stroke="#30393f"/>
<text x="508.0" y="243" font-size="11.5" fill="#9aa7b0">the builder <tspan font-weight="600" fill="#e6edf3">places what pays</tspan></text>
<line x1="707.0" y1="141.0" x2="725.0" y2="141.0" stroke="#9aa7b0" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="728.0" y="30" width="212.0" height="222" rx="10" fill="#161b22" stroke="#3fb990" stroke-width="1.5"/>
<circle cx="752.0" cy="56" r="12" fill="#3fb990"/>
<text x="752.0" y="60.5" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1117">4</text>
<text x="772.0" y="61" font-size="15" font-weight="600" fill="#e6edf3">Watch it land</text>
<text x="744.0" y="88" font-size="11" fill="#3fb990">any time</text>
<text x="744.0" y="112" fill="#e6edf3">your executions on chain,</text>
<text x="744.0" y="128" fill="#e6edf3">found by your contract's logs</text>
<rect x="740.0" y="160" width="188.0" height="26" rx="5" fill="#21282f"/>
<text x="748.0" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#e6edf3">eth_getLogs</text>
<line x1="744.0" y1="226" x2="924.0" y2="226" stroke="#30393f"/>
<text x="744.0" y="243" font-size="11.5" fill="#9aa7b0">you see <tspan font-weight="600" fill="#3fb990">sent · landed</tspan></text>
<text x="480.0" y="272" text-anchor="middle" font-size="12" fill="#67757c">Each recipe shows these four steps with its own commands.</text>
</svg>
